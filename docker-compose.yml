# One command: docker compose up --build
# MongoDB runs as a single node replica set (transactions need one). Everything outside is in MOCK mode.
services:
  mongo:
    image: mongo:8.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["4000:4000"]
    environment:
      NODE_ENV: development
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/thunikart?replicaSet=rs0
      MONGODB_DB_NAME: thunikart
      SEED_ADMIN_EMAIL: thunikartbykrishnasorchids@gmail.com
      SEED_ADMIN_PASSWORD: Admin-Dev-2026
      # Every other variable stays REPLACE_ME, so payments, storage, email and shipping run as mocks.
    volumes:
      - ./backend/src:/repo/backend/src
      - ./backend/seed:/repo/backend/seed
      - ./shared/src:/repo/shared/src

volumes:
  mongo-data:
