name: Deploy backend to Catalyst AppSail
# Manual on purpose: a person chooses when production changes. Run it from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (a commit SHA from the CI run, or latest)
        default: latest
      environment:
        description: Catalyst environment
        type: choice
        options: [development, production]
        default: development

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # add required reviewers on "production" in repo settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g zcatalyst-cli
      - name: Pull the CI built image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/backend:${{ inputs.image_tag }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "$IMAGE"
          docker tag "$IMAGE" thunikart-backend:deploy
      - name: Deploy (Catalyst CLI, non interactive)
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}   # from `catalyst token:generate`
        run: catalyst deploy appsail --name thunikart-api --source docker://thunikart-backend:deploy --port 9000 -ni
