name: Deploy backend to Catalyst AppSail
# One target, no GitHub environments. Two ways in:
#  1. Automatic: when CI succeeds for a push to main, the exact image CI just built is deployed to Catalyst AppSail.
#  2. Manual (Actions tab, "Run workflow"): deploy any image tag again, for example to roll back.
# The three Catalyst values are ordinary repository secrets (Settings, Secrets and variables, Actions).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (a commit SHA from a CI run, or latest)
        default: latest

# One deploy at a time. A newer one waits for the running one instead of cancelling it half way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Automatic runs only for a successful CI run of a push to main (not for pull requests).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ github.event.workflow_run.head_sha || inputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g zcatalyst-cli
      - name: Pull the image CI built
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/backend:${TAG}"
          echo "Deploying ${IMAGE}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "$IMAGE"
          docker tag "$IMAGE" thunikart-backend:deploy
      - name: Deploy (Catalyst CLI, non interactive)
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}   # from `catalyst token:generate`
          CATALYST_PROJECT_ID: ${{ secrets.CATALYST_PROJECT_ID }}
          CATALYST_ORG_ID: ${{ secrets.CATALYST_ORG_ID }}
        run: |
          # There is no catalyst.json in the repo, so the project is named here (repository secrets).
          EXTRA=""
          [ -n "$CATALYST_PROJECT_ID" ] && EXTRA="$EXTRA --project $CATALYST_PROJECT_ID"
          [ -n "$CATALYST_ORG_ID" ] && EXTRA="$EXTRA --org $CATALYST_ORG_ID"
          catalyst deploy appsail --name thunikart-api --source docker://thunikart-backend:deploy --port 9000 -ni $EXTRA
      - name: Health check after deploy
        # Set the repository (or environment) variable BACKEND_HEALTH_URL, for example https://thunikart-api-xxxx.development.catalystappsail.in/health
        if: vars.BACKEND_HEALTH_URL != ''
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${{ vars.BACKEND_HEALTH_URL }}" || true)
            echo "attempt $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "The new version did not answer /health in time."
          exit 1
