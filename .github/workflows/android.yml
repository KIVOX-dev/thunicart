name: Android apps
# Builds two installable Android apps (APK files) that open the live websites, and publishes them on the "android-latest" release:
#   thunikart-admin.apk  ->  https://thunicart-frontend.vercel.app/admin/   (admin, stock, Billing center)
#   thunikart-billing.apk ->  https://thunicart-frontend.vercel.app/billing  (the Billing center only)
#   thunikart-shop.apk   ->  https://thunicart-frontend.vercel.app/         (the customer shop)
# Run it from the Actions tab (Run workflow), or it runs by itself when the Android project changes.
# Download on the phone: https://github.com/<owner>/<repo>/releases/tag/android-latest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile/android/**', '.github/workflows/android.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: admin
            appId: in.thunikart.admin
            label: Thunikart Admin
            url: https://thunicart-frontend.vercel.app/admin/
            host: thunicart-frontend.vercel.app
            path: /admin
          - name: billing
            appId: in.thunikart.billing
            label: Thunikart Billing
            url: https://thunicart-frontend.vercel.app/billing
            host: thunicart-frontend.vercel.app
            path: /billing
          - name: shop
            appId: in.thunikart.shop
            label: Thunikart
            url: https://thunicart-frontend.vercel.app/
            host: thunicart-frontend.vercel.app
            path: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build the APK
        run: >-
          gradle -p mobile/android assembleRelease --no-daemon
          -PappId='${{ matrix.appId }}' -PappLabel='${{ matrix.label }}' -PdefaultUrl='${{ matrix.url }}'
          -PhostName='${{ matrix.host }}' -PpathPrefix='${{ matrix.path }}'
          -PversionCode='${{ github.run_number }}' -PversionName='1.${{ github.run_number }}'
      - name: Name the file
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk thunikart-${{ matrix.name }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: thunikart-${{ matrix.name }}
          path: thunikart-${{ matrix.name }}.apk

  publish:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: thunikart-*
          merge-multiple: true
      - name: Publish on the android-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android apps (latest)
          body: |
            Install on an Android phone: open this page on the phone, tap the APK, and allow "Install unknown apps" for your browser when asked.
            - **thunikart-admin.apk** ("Thunikart Admin"): admin, stock, Billing center
            - **thunikart-billing.apk** ("Thunikart Billing"): the Billing center only
            - **thunikart-shop.apk**: the customer shop

            The apps open the live websites, so they always show the latest version. Nothing to update here unless the app itself changes.
          files: |
            thunikart-admin.apk
            thunikart-shop.apk
          make_latest: false
