name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (includes the rule that backend never imports frontend)
        run: pnpm --filter @thunikart/backend --filter @thunikart/shared lint
      - name: Type check
        run: pnpm --filter @thunikart/backend --filter @thunikart/shared typecheck
      - name: Tests (in-memory MongoDB replica set, clean seeded database)
        run: pnpm --filter @thunikart/backend test
      - name: OpenAPI spec and typed client are up to date
        run: |
          pnpm openapi
          git diff --exit-code docs/api/openapi.json shared/src/api-client/schema.d.ts
      - name: Build
        run: pnpm --filter @thunikart/backend build

  docker-image:
    # Builds the production image on every push and PR; pushes to GitHub Container Registry only from main.
    runs-on: ubuntu-latest
    needs: backend
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
